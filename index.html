<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 강점 캐릭터 프롬프트 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EC;
    --cream-2:#FFF1DD;
    --ink:#4A3B2A;
    --ink-soft:#8B7A63;
    --orange:#FF9E5E;
    --orange-deep:#F2812F;
    --yellow:#FFD45E;
    --mint:#5FC8AE;
    --mint-deep:#3FB199;
    --line:#EAD9BE;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Gowun Dodum',sans-serif;
    background:linear-gradient(160deg,var(--cream) 0%,var(--cream-2) 100%);
    color:var(--ink);
    min-height:100vh;
    line-height:1.6;
    padding:24px 16px 64px;
  }
  .wrap{max-width:720px;margin:0 auto;}

  /* ---- header ---- */
  .head{text-align:center;margin-bottom:28px;}
  .head .star{color:var(--yellow);font-size:1.4rem;}
  .head h1{
    font-family:'Jua',sans-serif;
    font-size:2rem;
    margin:6px 0 4px;
    color:var(--ink);
    letter-spacing:.5px;
  }
  .head p{margin:0;color:var(--ink-soft);font-size:1rem;}

  /* ---- card shell ---- */
  .card{
    background:var(--white);
    border:2px solid var(--line);
    border-radius:22px;
    padding:22px 20px;
    margin-bottom:18px;
    box-shadow:0 6px 0 rgba(234,217,190,.45);
  }
  .step-label{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Jua',sans-serif;
    font-size:1.15rem;
    color:var(--orange-deep);
    margin:0 0 14px;
  }
  .step-num{
    background:var(--orange);color:#fff;
    width:30px;height:30px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:1rem;
  }

  label{display:block;font-size:.98rem;color:var(--ink);margin:14px 0 6px;font-weight:bold;}
  .hint{font-size:.86rem;color:var(--ink-soft);font-weight:normal;margin-top:2px;}
  input[type=text]{
    width:100%;
    font-family:'Gowun Dodum',sans-serif;
    font-size:1.05rem;
    padding:13px 15px;
    border:2px solid var(--line);
    border-radius:14px;
    background:#FFFDF8;
    color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]::placeholder{color:#C9B89A;}
  input[type=text]:focus{
    outline:none;
    border-color:var(--orange);
    box-shadow:0 0 0 4px rgba(255,158,94,.18);
  }

  .strength-block{
    background:#FFFBF2;
    border:1.5px dashed var(--line);
    border-radius:16px;
    padding:14px 14px 18px;
    margin-top:10px;
  }
  .strength-block .tag{
    font-family:'Jua',sans-serif;color:var(--mint-deep);font-size:1rem;
  }

  /* ---- make button ---- */
  .make-btn{
    width:100%;
    font-family:'Jua',sans-serif;
    font-size:1.3rem;
    color:#fff;
    background:linear-gradient(135deg,var(--orange) 0%,var(--orange-deep) 100%);
    border:none;
    border-radius:18px;
    padding:18px;
    cursor:pointer;
    box-shadow:0 5px 0 #D96E22;
    transition:transform .08s, box-shadow .08s;
    letter-spacing:1px;
  }
  .make-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #D96E22;}

  /* ---- results ---- */
  #results{margin-top:26px;}
  .results-title{
    font-family:'Jua',sans-serif;font-size:1.25rem;text-align:center;
    color:var(--ink);margin:0 0 6px;
  }
  .results-sub{text-align:center;color:var(--ink-soft);font-size:.9rem;margin:0 0 18px;}
  .results-sub .warn{display:inline-block;margin-top:5px;color:var(--orange-deep);font-weight:bold;}

  .prompt-card{
    border-radius:18px;
    padding:16px 16px 14px;
    margin-bottom:14px;
    border:2px solid;
    background:#fff;
    animation:pop .28s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98);}to{opacity:1;transform:none;}}
  .prompt-card.character{border-color:var(--yellow);background:#FFFCEF;}
  .prompt-card.s1{border-color:var(--orange);background:#FFF6EE;}
  .prompt-card.s2{border-color:var(--mint);background:#EFFBF7;}

  .prompt-card .pc-head{
    font-family:'Jua',sans-serif;font-size:1.02rem;margin-bottom:8px;display:flex;align-items:center;gap:7px;
  }
  .character .pc-head{color:#C99A1E;}
  .s1 .pc-head{color:var(--orange-deep);}
  .s2 .pc-head{color:var(--mint-deep);}

  .prompt-text{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;font-size:1.02rem;color:var(--ink);
    word-break:keep-all;
  }
  .copy-btn{
    margin-top:10px;width:100%;
    font-family:'Jua',sans-serif;font-size:1.05rem;
    border:none;border-radius:12px;padding:12px;cursor:pointer;
    color:#fff;transition:transform .08s, opacity .15s;
  }
  .character .copy-btn{background:#E9B22E;}
  .s1 .copy-btn{background:var(--orange-deep);}
  .s2 .copy-btn{background:var(--mint-deep);}
  .copy-btn:active{transform:scale(.97);}
  .copy-btn.done{background:#7CB342 !important;}

  .canva-note{
    background:#FFF4E0;border:1.5px solid var(--line);border-radius:16px;
    padding:14px 16px;margin-top:8px;font-size:.95rem;color:var(--ink);
  }
  .canva-note b{color:var(--orange-deep);}
  .canva-note .row{margin-top:6px;}

  .empty-msg{text-align:center;color:var(--ink-soft);padding:8px 0 0;font-size:.95rem;}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="star">✦</div>
    <h1>나의 강점 캐릭터 프롬프트 만들기</h1>
    <p>나의 강점을 적으면, AI에게 줄 명령어(프롬프트)를 만들어 줘요</p>
  </div>

  <!-- STEP 1: 동물 -->
  <div class="card">
    <span class="step-label"><span class="step-num">1</span>나의 캐릭터 동물 정하기</span>
    <label>어떤 동물로 나를 표현하고 싶나요?
      <span class="hint">예) 쿼카, 다람쥐, 곰, 펭귄, 강아지</span>
    </label>
    <input type="text" id="animal" placeholder="동물 이름을 적어요" autocomplete="off">
  </div>

  <!-- STEP 2: 강점 -->
  <div class="card">
    <span class="step-label"><span class="step-num">2</span>나의 강점 두 가지 적기</span>

    <div class="strength-block">
      <span class="tag">⭐ 첫 번째 강점</span>
      <label>나의 강점 단어
        <span class="hint">예) 배려, 예의, 회복성, 열정</span>
      </label>
      <input type="text" id="word1" placeholder="강점 단어" autocomplete="off">
      <label>이 강점이 드러나는 장면
        <span class="hint">예) 슬퍼하는 친구의 손을 잡고 따뜻하게 위로해주는 모습</span>
      </label>
      <input type="text" id="scene1" placeholder="~하는 모습으로 적어요" autocomplete="off">
    </div>

    <div class="strength-block" style="margin-top:14px;">
      <span class="tag">⭐ 두 번째 강점</span>
      <label>나의 강점 단어
        <span class="hint">예) 배려, 예의, 회복성, 열정</span>
      </label>
      <input type="text" id="word2" placeholder="강점 단어" autocomplete="off">
      <label>이 강점이 드러나는 장면
        <span class="hint">예) 모둠 활동에서 친구들의 의견을 귀 기울여 듣는 모습</span>
      </label>
      <input type="text" id="scene2" placeholder="~하는 모습으로 적어요" autocomplete="off">
    </div>
  </div>

  <button class="make-btn" onclick="generate()">✨ 프롬프트 만들기 ✨</button>

  <div id="results"></div>

</div>

<script>
  // 받침에 따라 '가/이' 붙이기
  function withGa(word){
    if(!word) return word;
    const ch = word.charCodeAt(word.length-1);
    if(ch < 0xAC00 || ch > 0xD7A3) return word + "가"; // 한글 아니면 기본 '가'
    const hasJong = (ch - 0xAC00) % 28 !== 0;
    return word + (hasJong ? "이" : "가");
  }

  const STYLE = "고품질 3D 애니메이션 스타일, 흰색 배경.";

  function makeCharacterPrompt(animal){
    return `귀여운 ${animal} 캐릭터가 정면을 보며 환하게 웃고 있습니다. ${STYLE}`;
  }
  function makeScenePrompt(animal, scene){
    return `귀여운 ${withGa(animal)} ${scene}. ${STYLE}`;
  }

  function escapeHtml(s){
    return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  function cardHTML(cls, headIcon, headText, prompt, idx){
    return `
      <div class="prompt-card ${cls}">
        <div class="pc-head">${headIcon} ${headText}</div>
        <div class="prompt-text" id="ptext${idx}">${escapeHtml(prompt)}</div>
        <button class="copy-btn" onclick="copyText(${idx}, this)">복사하기</button>
      </div>`;
  }

  function generate(){
    const animal = document.getElementById('animal').value.trim();
    const word1  = document.getElementById('word1').value.trim();
    const scene1 = document.getElementById('scene1').value.trim();
    const word2  = document.getElementById('word2').value.trim();
    const scene2 = document.getElementById('scene2').value.trim();
    const box = document.getElementById('results');

    if(!animal){
      box.innerHTML = `<div class="card"><p class="empty-msg">먼저 위에서 나의 동물을 정해 주세요! 🐾</p></div>`;
      box.scrollIntoView({behavior:'smooth'});
      return;
    }

    let html = `
      <p class="results-title">🎨 완성된 프롬프트</p>
      <p class="results-sub">복사하기 버튼을 누르고 Magic Media 칸에 붙여넣어요<br><span class="warn">주의! 하나씩 복사해서 만들기!</span></p>`;

    // 1) 캐릭터
    html += cardHTML('character','🌟','나의 기본 캐릭터', makeCharacterPrompt(animal), 0);

    // 2) 강점1 장면
    if(scene1){
      html += cardHTML('s1','⭐', (word1 ? `첫 번째 강점 · ${escapeHtml(word1)}` : '첫 번째 강점'), makeScenePrompt(animal, scene1), 1);
    }
    // 3) 강점2 장면
    if(scene2){
      html += cardHTML('s2','⭐', (word2 ? `두 번째 강점 · ${escapeHtml(word2)}` : '두 번째 강점'), makeScenePrompt(animal, scene2), 2);
    }

    // Canva 글자 안내
    if(word1 || word2){
      html += `<div class="canva-note">
        ✏️ <b>Canva 템플릿 글자도 바꿔 주세요</b>`;
      if(word1) html += `<div class="row">· 나의 첫 번째 강점은 → <b>${escapeHtml(word1)}</b></div>`;
      if(word2) html += `<div class="row">· 나의 두 번째 강점은 → <b>${escapeHtml(word2)}</b></div>`;
      html += `</div>`;
    }

    box.innerHTML = html;
    box.scrollIntoView({behavior:'smooth'});
  }

  function copyText(idx, btn){
    const text = document.getElementById('ptext'+idx).innerText;
    navigator.clipboard.writeText(text).then(()=>{
      const original = btn.innerText;
      btn.innerText = "복사됐어요! ✓";
      btn.classList.add('done');
      setTimeout(()=>{ btn.innerText = original; btn.classList.remove('done'); }, 1600);
    }).catch(()=>{
      // 클립보드 실패 시 선택 안내
      const range = document.createRange();
      range.selectNodeContents(document.getElementById('ptext'+idx));
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      btn.innerText = "직접 복사해요 (Ctrl+C)";
    });
  }
</script>
</body>
</html>
